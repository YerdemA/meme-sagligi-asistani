name: meme_sagligi_asistani
description: "Meme sağlığı farkındalığı ve AI destekli risk değerlendirme uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Metin seslendirme (TTS) — sesli rehber için
  flutter_tts: ^4.2.5

  # API istekleri — FastAPI backend'e bağlanmak için
  http: ^1.2.1

  # Yazı tipleri
  google_fonts: ^6.1.0

  # iOS ikonları
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true

  assets:
    - assets/education/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png" # Logonu nereye koyduysan onun tam yolu
  min_sdk_android: 21